<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub release draft deleter</title>
<style>
body, #container, #inner-container {
    display: flex;
    align-items: center;
    flex-direction: column;
}

body, #container {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
}

#container {
    justify-content: space-around;
    max-width: min(80vw, 600px);
}
#params-form {
    display: contents;
}

input, button {
    width: min(60vw, 500px);
    border: 1px grey solid;
    border-radius: 10px;
    padding: 10px;
    margin: 5px;
    box-sizing: border-box;
}

button:hover {
    background-color: gray;
    color: white;
}
p {
    text-align: justify;
}

h1 {
    text-align: center;
}

#log {
    overflow-y: scroll;
    width: 100vw;
}

::-webkit-input-placeholer, :-moz-placeholder, input {
    text-align: center;
}


</style>
</head>
<body>
    <main id="container">
        <h1>GitHub release draft deleter</h1>
        <header>
            <p>If you are lazy like me you can use query strings to pre-fill the elements like user, repo and token.</p>
            <p>All the data is processed locally. The only communication is with GitHub API.</p>
        </header>
        <!-- <h1>Token</h1> -->
        <section id="inner-container">
            <form id="params-form">
                <input id="token" placeholder="Token" type="password" autocomplete="new-password" />
                <!-- <h1>User</h1> -->
                <input id="user" placeholder="User" type="text" />
                <!-- <h1>Repository</h1> -->
                <input id="repo" placeholder="Repository" type="text" />
                <button type="submit">Start</button>
            </form>
        </section>
        <section id="log"></section>
    </main>
    <script>
    function reportError(error, metadata) {
        console.error("Centralized Error Report:", error, metadata);
    }
    (function() {
        let url = new URL(window.location.href)
        document.getElementById("token").value = url.searchParams.get("token") || ''
        document.getElementById("user").value = url.searchParams.get("user") || ''
        document.getElementById("repo").value = url.searchParams.get("repo") || ''
    })()
    async function listReleases() {
        const token = document.getElementById("token").value.trim()
        const user = document.getElementById("user").value.trim()
        const repo = document.getElementById("repo").value.trim()
        if (token.length === 0) {
            throw new Error("Token not specified")
        }
        if (user.length === 0) {
            throw new Error("User not specified")
        }
        if (repo.length === 0) {
            throw new Error("Repository not specified")
        }
        const perPage = 100
        let page = 1
        const all = []
        while (true) {
            const url = `https://api.github.com/repos/${user}/${repo}/releases?per_page=${perPage}&page=${page}`
            const results = await fetch(url, {
                headers: {
                    "accept": "application/vnd.github.v3+json",
                    "authorization": `token ${token}`
                }
            })
            if (!results.ok) {
                let msg = `${results.status} ${results.statusText}`
                try {
                    const err = await results.json()
                    if (err && err.message) {
                        msg += ` - ${err.message}`
                    }
                } catch (e) {
                    reportError(e, { context: "listReleases_json_parse", status: results.status })
                }
                throw new Error(msg)
            }
            const items = await results.json()
            all.push(...items)
            if (items.length < perPage) {
                break
            }
            page++
        }
        return all
    }
    function logPromise(promise, description) {
        const statusMsg = document.createElement("p")
        document.getElementById("log").appendChild(statusMsg)
        statusMsg.textContent = `WIP: ${description}`
        promise
        .then((msg) => {
            statusMsg.textContent = `${description} - OK ${msg}`
        })
        .catch((err) => {
            reportError(err, { context: "logPromise", description })
            statusMsg.textContent = `${description} - ERR ${err.message || err}`
        })
    }
    async function handleSubmit(e) {
        e.preventDefault()
        const logEl = document.getElementById("log")
        try {
            const releases = await listReleases()
            const drafts = releases.filter((v) => v.draft)
            if (drafts.length === 0) {
                const p = document.createElement("p")
                p.textContent = "No draft releases found."
                logEl.appendChild(p)
                return
            }
            drafts.forEach((draft) => {
                logPromise(handleDraftDelete(draft), `Delete '${draft.name || draft.tag_name}' (${draft.html_url})`)
            })
        } catch (err) {
            reportError(err, { context: "handleSubmit" })
            const p = document.createElement("p")
            p.textContent = `Error listing releases: ${err.message || err}`
            logEl.appendChild(p)
        }
    }
    async function handleDraftDelete(release) {
        if (!release.draft) {
            throw new Error(`"${release.html_url}" is not a draft release`)
        }
        const token = document.getElementById("token").value.trim()
        const res = await fetch(release.url, {
            method: "DELETE",
            headers: {
                "authorization": `token ${token}`
            }
        })
        if (!res.ok) {
            let msg = `${res.status} ${res.statusText}`
            try {
                const err = await res.json()
                if (err && err.message) msg += ` - ${err.message}`
            } catch (e) {
                reportError(e, { context: "handleDraftDelete_json_parse", status: res.status })
            }
            throw new Error(msg)
        }
        return "deleted"
    }
    document.getElementById("params-form").addEventListener('submit', handleSubmit)
    </script>
</body>
</html>
